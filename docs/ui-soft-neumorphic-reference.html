<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Piltover Soft UI Visual Contract</title>
<style>
:root{--base:#ECE4D6;--raised:#EFE7D9;--inset:#E9DFCF;--ink:#252923;--teal:#0C4F54;--hi:rgba(255,252,244,.92);--lo:rgba(163,147,121,.34)}
*{box-sizing:border-box}body{margin:0;background:var(--base);color:var(--ink);font:14px Inter,system-ui,sans-serif}
main{max-width:1100px;margin:auto;padding:32px}.row{display:flex;gap:24px;flex-wrap:wrap}.surface{width:180px;height:110px;border-radius:16px;background:var(--raised);border:1px solid rgba(255,255,255,.25);box-shadow:-7px -7px 15px var(--hi),7px 7px 15px var(--lo);display:grid;place-items:center}
.inset{box-shadow:inset -5px -5px 10px rgba(255,252,244,.75),inset 5px 5px 10px rgba(163,147,121,.26)}
.pressed{box-shadow:inset -3px -3px 7px rgba(255,252,244,.68),inset 3px 3px 7px rgba(142,126,103,.30)}
button{border:1px solid rgba(255,255,255,.15);border-radius:12px;background:var(--teal);color:#f7f1e6;padding:10px 18px;font-weight:700;box-shadow:-4px -4px 9px var(--hi),4px 4px 9px var(--lo)}
input{border:1px solid rgba(146,131,108,.26);border-radius:12px;background:var(--inset);padding:10px 12px;box-shadow:inset -5px -5px 10px rgba(255,252,244,.75),inset 5px 5px 10px rgba(163,147,121,.26)}
h2{margin-top:32px;border-bottom:1px solid rgba(12,79,84,.18);padding-bottom:8px}
</style></head><body><main>
<h1>Piltover Soft UI Visual Contract</h1>
<p>Visual-only reference. No product copy or behavior is defined here.</p>
<h2>Surfaces</h2><div class="row"><div class="surface">Raised</div><div class="surface inset">Inset</div><div class="surface pressed">Pressed</div></div>
<h2>Controls</h2><div class="row"><button>Primary</button><input placeholder="Inset field"></div>
</main></body></html>
